name: Build Nuitka Executables

# This is a rehearsal of release.yml: same Nuitka flags, same smoke test, same
# packaging step. Keep the two in step. A release job that only runs on a tag is
# a job whose first execution is the release itself, which is how v0.1.0 shipped
# nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "nuitka>=2.5" ordered-set zstandard

      - name: Create Nuitka entrypoint
        shell: python
        run: |
          from pathlib import Path
          Path("build").mkdir(exist_ok=True)
          # The import stays inside the __main__ guard: Nuitka re-executes the
          # entry module in the compiled binary, and importing at module level
          # has broken this build before.
          Path("build/tembench_entry.py").write_text(
              "#!/usr/bin/env python3\n"
              "# -*- coding: utf-8 -*-\n"
              "import sys\n"
              "if __name__ == '__main__':\n"
              "    from tembench.cli import app\n"
              "    app()\n",
              encoding="utf-8",
          )

      # Built as `tembench.bin` and renamed when packaged:
      # --include-package-data lays the package's data files out under
      # `tembench/`, which cannot coexist with an executable also called
      # `tembench` on POSIX. Windows is unaffected — there the executable is
      # `tembench.exe`, a different name from the data directory.
      - name: Build onefile executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=tembench.bin
          --include-package=tembench
          --include-package-data=tembench
          --include-package-data=altair
          build/tembench_entry.py

      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=tembench
          --include-package=tembench
          --include-package-data=tembench
          --include-package-data=altair
          --windows-console-mode=force
          --mingw64
          build/tembench_entry.py

      - name: Show what Nuitka produced
        shell: python
        run: |
          from pathlib import Path
          for item in sorted(Path("dist").rglob("*")):
              if item.is_file():
                  print(f"{item.stat().st_size:>12}  {item}")

      - name: Smoke test the executable
        run: python .github/scripts/smoke_binary.py

      - name: Package artifact
        run: python .github/scripts/package_binary.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tembench-${{ runner.os }}
          path: release/tembench-*
          if-no-files-found: error
