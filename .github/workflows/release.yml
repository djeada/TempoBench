name: Build and Release

# The build job is deliberately identical to build.yml's, which runs on every
# pull request. If you change the Nuitka flags here, change them there too —
# otherwise the release builds something no pull request has ever built.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "nuitka>=2.5" ordered-set zstandard

      - name: Check the tag matches the packaged version
        shell: python
        run: |
          import os
          import sys

          import tembench

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tembench.__version__
          if tag.lstrip("v") != expected:
              print(
                  f"Tag {tag!r} does not match __version__ {expected!r}. "
                  "Releasing them out of step ships binaries that misreport "
                  "which version they are."
              )
              sys.exit(1)
          print(f"Tag {tag} matches version {expected}")

      - name: Create Nuitka entrypoint
        shell: python
        run: |
          from pathlib import Path
          Path("build").mkdir(exist_ok=True)
          # The import stays inside the __main__ guard: Nuitka re-executes the
          # entry module in the compiled binary, and importing at module level
          # has broken this build before.
          Path("build/tembench_entry.py").write_text(
              "#!/usr/bin/env python3\n"
              "# -*- coding: utf-8 -*-\n"
              "import sys\n"
              "if __name__ == '__main__':\n"
              "    from tembench.cli import app\n"
              "    app()\n",
              encoding="utf-8",
          )

      # Built as `tembench.bin` and renamed when packaged:
      # --include-package-data lays the package's data files out under
      # `tembench/`, which cannot coexist with an executable also called
      # `tembench` on POSIX. Windows is unaffected — there the executable is
      # `tembench.exe`, a different name from the data directory.
      - name: Build onefile executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=tembench.bin
          --include-package=tembench
          --include-package-data=tembench
          --include-package-data=altair
          build/tembench_entry.py

      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=tembench
          --include-package=tembench
          --include-package-data=tembench
          --include-package-data=altair
          --windows-console-mode=force
          --mingw64
          build/tembench_entry.py

      - name: Show what Nuitka produced
        shell: python
        run: |
          from pathlib import Path
          for item in sorted(Path("dist").rglob("*")):
              if item.is_file():
                  print(f"{item.stat().st_size:>12}  {item}")

      # One step per stage: the public jobs API exposes step names and
      # conclusions but not log contents, so a Windows-only failure is
      # diagnosable from outside the repo without a token.
      - name: "Locate the built binary"
        run: python .github/scripts/find_binary.py

      - name: "Smoke test 1/3 - the binary starts"
        run: python .github/scripts/smoke_binary.py help

      - name: "Smoke test 2/3 - render a chart"
        run: python .github/scripts/smoke_binary.py plot

      - name: "Smoke test 3/3 - render a report"
        run: python .github/scripts/smoke_binary.py report

      - name: Package artifact
        run: python .github/scripts/package_binary.py

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tembench-${{ runner.os }}
          path: release/tembench-*
          if-no-files-found: error

  release:
    needs: build
    # Release whatever platforms actually built. `needs: build` alone means one
    # failing platform produces no release at all, which is how the first
    # v0.1.0 tag shipped nothing despite Linux and macOS both being fine. The
    # release is still a draft, and the step below refuses to publish an empty
    # one, so a total build failure cannot slip through as a release.
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release
          merge-multiple: true

      - name: Check which platforms made it
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path

          expected = {
              "tembench-linux": "Linux",
              "tembench-macos": "macOS",
              "tembench-windows.zip": "Windows",
          }
          release = Path("release")
          present = {f.name for f in release.glob("*") if f.is_file()}
          for name, label in expected.items():
              mark = "present" if name in present else "MISSING"
              size = f" ({(release / name).stat().st_size} bytes)" if name in present else ""
              print(f"{label:<8} {name:<22} {mark}{size}")

          if not present:
              print("\nNo binaries built at all. Refusing to create an empty release.")
              sys.exit(1)

          missing = [label for name, label in expected.items() if name not in present]
          if missing:
              # Surfaced in the job summary so the draft is not mistaken for a
              # complete release when it is reviewed before publishing.
              note = f"Draft is missing binaries for: {', '.join(missing)}"
              print(f"\n{note}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write(f"### Incomplete release\n\n{note}\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Created as a draft: the binaries are attached and reviewable, but
          # nothing is public until someone presses Publish.
          draft: true
          files: release/tembench-*
