benchmarks:
  - name: py_sort
    cmd: "{python} examples/sort_impl.py --n {n} --impl {impl}"
    workdir: "."
    env: {}

grid:
  n: [10000, 50000, 100000, 500000, 1000000, 5000000]
  impl: ["random", "sorted", "reversed"]

limits:
  timeout_sec: 30
  warmups: 1
  repeats: 5
  # sort_impl.py times its own sort call and prints a TEMPOBENCH_MS marker.
  metric: reported

pin_cpu: 0
