# Naive product of two n×n matrices.  Expected: O(n³).
# Run from the repository root; see examples/cross_language/README.md.
benchmarks:
  - name: cpp
    build: "mkdir -p examples/cross_language/build && g++ -O2 -std=c++17 -o examples/cross_language/build/algorithms_cpp examples/cross_language/algorithms.cpp"
    cmd: "examples/cross_language/build/algorithms_cpp --algo matrix_multiply --n {n}"
  - name: rust
    build: "mkdir -p examples/cross_language/build && rustc -C opt-level=3 -o examples/cross_language/build/algorithms_rs examples/cross_language/algorithms.rs"
    cmd: "examples/cross_language/build/algorithms_rs --algo matrix_multiply --n {n}"
  - name: python
    cmd: "{python} examples/cross_language/algorithms.py --algo matrix_multiply --n {n}"

grid:
  n: [16, 24, 32, 48, 64, 96, 128, 192, 256]

limits:
  timeout_sec: 60
  warmups: 1
  repeats: 5
  # Each program times only its kernel (repeated until 20 ms have been timed)
  # and prints TEMPOBENCH_MS, so process startup and input generation are not
  # part of the measurement.
  metric: reported
